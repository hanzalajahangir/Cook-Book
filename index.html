<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-utensils"></i> Recipe Book</h1>
            <p>Find Delicious Recipes from Around the World</p>
        </header>
        <p class="api-link">
            Data provided by <a href="https://www.themealdb.com/api.php" target="_blank">TheMealDB API</a>
        </p>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for a recipe...">
            <button id="search-btn"><i class="fas fa-search"></i> Search</button>
        </div>
        <div id="error-container" class="hidden">
            <p>No meals found for the given search term.</p>
        </div>
        <div id="result-heading"></div>

        <div id="meals" class="meals-container"></div>

        <div id="meal-details" class="hidden">
            <button id="back-btn"><i class="fas fa-arrow-left"></i> Back to recipes</button>
        </div>

        <div class="meal-details-content"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
